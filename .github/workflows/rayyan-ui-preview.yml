name: Rayyan UI Preview APK
on:
  push:
    branches: [ rayyan-entry-ready-menu-fix ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rayyan-entry-ready-menu-fix
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Restore signing key
        run: base64 -d app/rayyan4-debug.keystore.b64 > app/rayyan4-debug.keystore
      - name: Build preview APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Rayyan-UI-Preview-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
