name: RAYYAN SMART AUTO-POWERFULL APK + EA Build
on:
  push:
    branches: [RAYYAN]
  workflow_dispatch:
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Restore debug signing key
        run: base64 -d app/rayyan4-debug.keystore.b64 > app/rayyan4-debug.keystore
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RAYYAN-SMART-AUTO-POWERFULL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  mt5-ea:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Install MetaTrader 5 / MetaEditor
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/auto' -Wait
          $candidates = @('C:\Program Files\MetaTrader 5\metaeditor64.exe', 'C:\Program Files (x86)\MetaTrader 5\metaeditor64.exe')
          $editor = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $editor) {
            $editor = Get-ChildItem "$env:APPDATA\MetaQuotes\Terminal" -Filter 'metaeditor64.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $editor) { throw 'MetaEditor64.exe was not found after MT5 installation.' }
          $terminalCandidates = @('C:\Program Files\MetaTrader 5\terminal64.exe', 'C:\Program Files (x86)\MetaTrader 5\terminal64.exe')
          $terminal = $terminalCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($terminal) {
            $bootstrap = Start-Process -FilePath $terminal -ArgumentList '/portable' -PassThru
            Start-Sleep -Seconds 8
            Stop-Process -Id $bootstrap.Id -Force -ErrorAction SilentlyContinue
          }
          $dataRoot = Join-Path $env:APPDATA 'MetaQuotes\Terminal'
          $tradeInclude = Get-ChildItem @('C:\Program Files\MetaTrader 5', 'C:\Program Files (x86)\MetaTrader 5', $dataRoot) -Filter 'Trade.mqh' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $tradeInclude) {
            throw 'MT5 standard library Trade.mqh is missing after terminal initialization; cannot compile EA safely.'
          }
          $includeSource = $tradeInclude.Directory.Parent.FullName
          $dataDirs = Get-ChildItem $dataRoot -Directory -ErrorAction SilentlyContinue | Where-Object { Test-Path (Join-Path $_.FullName 'MQL5') }
          foreach ($dataDir in $dataDirs) {
            $targetInclude = Join-Path $dataDir.FullName 'MQL5\Include'
            New-Item -ItemType Directory -Path $targetInclude -Force | Out-Null
            Copy-Item (Join-Path $includeSource '*') $targetInclude -Recurse -Force
          }
          Write-Host "Prepared MT5 standard library from $includeSource for $($dataDirs.Count) terminal data folder(s)."
          "METAEDITOR=$editor" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile Rayyan Gateway EA
        shell: pwsh
        run: |
          $source = (Resolve-Path 'mt5/Experts/Rayyan4GatewayEA.mq5').Path
          $sourceDir = Split-Path $source
          $log = Join-Path $env:RUNNER_TEMP 'Rayyan4GatewayEA-compile.log'
          Remove-Item $log -Force -ErrorAction SilentlyContinue
          $args = "/compile:`"$source`" /log:`"$log`""
          $process = Start-Process -FilePath $env:METAEDITOR -ArgumentList $args -PassThru -Wait
          Start-Sleep -Seconds 2
          # The first MetaEditor invocation creates its per-installation data folder.
          # Seed that folder with the official Include tree from the MT5 installation,
          # then compile again so standard headers such as Trade/Trade.mqh resolve.
          $includeSource = 'C:\Program Files\MetaTrader 5\MQL5\Include'
          if (-not (Test-Path $includeSource)) {
            $includeSource = 'C:\Program Files (x86)\MetaTrader 5\MQL5\Include'
          }
          if ((Test-Path $includeSource) -and (Test-Path $log)) {
            $firstCompileLog = Get-Content $log -Raw
            $mql5Match = [regex]::Match($firstCompileLog, '(?i)(?<root>[A-Z]:\\Users\\[^\\]+\\AppData\\Roaming\\MetaQuotes\\Terminal\\[^\\]+\\MQL5)\\Include\\Trade\\Trade\.mqh')
            if ($mql5Match.Success) {
              $targetInclude = Join-Path $mql5Match.Groups['root'].Value 'Include'
              New-Item -ItemType Directory -Path $targetInclude -Force | Out-Null
              Copy-Item (Join-Path $includeSource '*') $targetInclude -Recurse -Force
              Write-Host "Copied standard MQL5 headers into $targetInclude"
              Remove-Item $log -Force -ErrorAction SilentlyContinue
              $process = Start-Process -FilePath $env:METAEDITOR -ArgumentList $args -PassThru -Wait
              Start-Sleep -Seconds 2
            } else {
              Write-Host 'Could not derive MetaEditor data folder from first compiler log; retaining original compile log.'
            }
          }
          if (Test-Path $log) {
            Get-Content $log
          } else {
            Write-Host "MetaEditor exited with code $($process.ExitCode) but did not create the requested compile log."
            Write-Host "MetaEditor path: $env:METAEDITOR"
            Write-Host "Source exists: $(Test-Path $source)"
            Get-ChildItem $sourceDir -Force | Select-Object Name, Length, LastWriteTime
            throw "MetaEditor did not create compile log $log; compilation cannot be verified."
          }
          $binary = Join-Path $sourceDir 'Rayyan4GatewayEA.ex5'
          if (-not (Test-Path $binary)) {
            $found = Get-ChildItem "$env:APPDATA\MetaQuotes\Terminal" -Filter 'Rayyan4GatewayEA.ex5' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { Copy-Item $found.FullName $binary -Force }
          }
          if (-not (Test-Path $binary)) {
            Get-Content $log -Raw
            throw "EA compile did not produce $binary. See compiler output above."
          }
          $compileLog = Get-Content $log -Raw
          if ($compileLog -match '(?im)\b[1-9]\d* errors?\b') { throw 'MetaEditor reported compile errors.' }
      - uses: actions/upload-artifact@v4
        with:
          name: RAYYAN-SMART-AUTO-POWERFULL-EA
          path: |
            mt5/Experts/Rayyan4GatewayEA.ex5
            mt5/Experts/Rayyan4GatewayEA.mq5
            ${{ runner.temp }}/Rayyan4GatewayEA-compile.log
          if-no-files-found: error
          retention-days: 30
