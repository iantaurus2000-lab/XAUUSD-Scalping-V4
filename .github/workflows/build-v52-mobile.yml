name: XAUUSD MOBILE ENGINE V5.2-A

on:
  workflow_dispatch:
  push:
    paths:
      - "v5.2-mobile-engine/**"
      - ".github/workflows/build-v52-mobile.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip
          echo "$PWD/gradle-8.10/bin" >> "$GITHUB_PATH"
      - name: Build V5.2-A
        working-directory: v5.2-mobile-engine
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          APK=$(find v5.2-mobile-engine/app/build/outputs/apk -name "*.apk" | head -1)
          test -n "$APK"
          sha256sum "$APK"
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-MOBILE-ENGINE-V5-2-A
          path: v5.2-mobile-engine/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
