name: XAUUSD BIQUOTE V5.1.2 FIXED FINAL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.10
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip
          echo "$PWD/gradle-8.10/bin" >> "$GITHUB_PATH"

      - name: Prepare Android Project
        run: |
          echo "Mencari Android project..."

          if [ -f "settings.gradle.kts" ]; then
            echo "Project ditemukan di root."
            exit 0
          fi

          if [ -f "settings.gradle" ]; then
            echo "Project ditemukan di root."
            exit 0
          fi

          ZIP=$(find . -type f \
            -name "XAUUSD_BIQUOTE_V5_1_2_FIXED_FINAL_SOURCE.zip" \
            | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Source ZIP tidak ditemukan."
            exit 1
          fi

          echo "Source ZIP ditemukan:"
          echo "$ZIP"

          rm -rf source_project
          mkdir source_project

          unzip -q "$ZIP" -d source_project

          SETTINGS=$(find source_project -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) tidak ditemukan."
            find source_project -maxdepth 5 -type f
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$ROOT"

          cp -r "$ROOT"/. .

          echo "Project berhasil disiapkan."

      - name: Verify Android Project
        run: |
          echo "Memeriksa project..."

          test -f settings.gradle.kts || test -f settings.gradle

          test -f app/build.gradle.kts

          echo "Android project OK."

      - name: Build APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "===================================="
          echo "BUILD BERHASIL"
          echo "===================================="

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-BIQUOTE-V5-1-2-FIXED-FINAL-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
