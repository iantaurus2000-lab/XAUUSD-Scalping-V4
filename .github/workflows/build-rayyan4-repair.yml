name: Rayyan4 Repair APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Restore stable Rayyan4 signing key
        run: base64 -d app/rayyan4-debug.keystore.b64 > app/rayyan4-debug.keystore
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload Rayyan4 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Rayyan4-Repair-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rayyan4-Repair-Build-Reports
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
