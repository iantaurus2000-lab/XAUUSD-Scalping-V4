name: Rayyan10 Simple Entry Build
on:
  push:
    branches: [ rayyan10-simple-m1-wick-entry, rayyan10-synced-entry-atr-chart-fix ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Restore debug signing key
        run: base64 -d app/rayyan4-debug.keystore.b64 > app/rayyan4-debug.keystore
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Mobile-Engine-RAYYAN10
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
