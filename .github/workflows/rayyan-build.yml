name: Rayyan POWERFULL build

on:
  push:
    branches:
      - RAYYAN
    paths:
      - 'app/**'
      - 'pingtest/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/rayyan-build.yml'
      - 'mt5/Experts/Rayyan4GatewayEA.mq5'
      - 'app/rayyan4-debug.keystore.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    if: github.event_name == 'workflow_dispatch'
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: RAYYAN

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Restore debug signing key
        run: base64 -d app/rayyan4-debug.keystore.b64 > app/rayyan4-debug.keystore

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Mobile-Engine-RAYYAN-POWERFULL-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload EA source package
        uses: actions/upload-artifact@v4
        with:
          name: Rayyan-POWERFULL-MQ5-source
          path: |
            mt5/Experts/Rayyan4GatewayEA.mq5
          if-no-files-found: error
          retention-days: 14

  mt5-ea:
    if: github.event_name == 'workflow_dispatch'
    name: Compile MQL5 EAs with MetaEditor
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: RAYYAN

      - name: Install MetaTrader 5 / MetaEditor
        shell: pwsh
        run: |
          # Correct possible hosted-runner clock drift before validating the vendor TLS certificate.
          Write-Host "Runner UTC before sync: $([DateTime]::UtcNow.ToString('o'))"
          try {
            Start-Service w32time -ErrorAction SilentlyContinue
            w32tm /resync /force | Out-Host
          } catch {
            Write-Warning "Time resynchronization was unavailable: $($_.Exception.Message)"
          }
          Write-Host "Runner UTC after sync: $([DateTime]::UtcNow.ToString('o'))"

          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          # Use official MetaQuotes/MetaTrader download endpoints only. TLS validation stays enabled.
          $installerUris = @(
            'https://download.mql5.com/cdn/web/metaquotes.ltd/mt5/mt5setup.exe?utm_source=www.metatrader5.com&utm_campaign=download',
            'https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/mt5setup.exe',
            'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'
          )
          $downloaded = $false
          $lastDownloadError = ''
          foreach ($installerUri in $installerUris) {
            for ($attempt = 1; $attempt -le 2; $attempt++) {
              try {
                Write-Host "Downloading official MT5 installer from $($installerUri.Split('?')[0]) (attempt $attempt/2)"
                Invoke-WebRequest -Uri $installerUri -OutFile $installer -TimeoutSec 90
                if ((Test-Path $installer) -and (Get-Item $installer).Length -gt 1000000) {
                  $downloaded = $true
                  break
                }
                throw 'Installer download was unexpectedly small or missing.'
              } catch {
                $lastDownloadError = $_.Exception.Message
                Remove-Item $installer -Force -ErrorAction SilentlyContinue
                if ($attempt -lt 2) { Start-Sleep -Seconds 5 }
              }
            }
            if ($downloaded) { break }
          }
          if (-not $downloaded) {
            throw "Official MT5 installer download failed from all trusted endpoints. TLS certificate validation was not bypassed. Last error: $lastDownloadError"
          }
          Start-Process -FilePath $installer -ArgumentList '/auto' -Wait
          $candidates = @('C:\Program Files\MetaTrader 5\metaeditor64.exe', 'C:\Program Files (x86)\MetaTrader 5\metaeditor64.exe')
          $editor = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $editor) {
            $editor = Get-ChildItem "$env:APPDATA\MetaQuotes\Terminal" -Filter 'metaeditor64.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $editor) { throw 'MetaEditor64.exe was not found after MT5 installation.' }
          $terminalCandidates = @('C:\Program Files\MetaTrader 5\terminal64.exe', 'C:\Program Files (x86)\MetaTrader 5\terminal64.exe')
          $terminal = $terminalCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($terminal) {
            $bootstrap = Start-Process -FilePath $terminal -ArgumentList '/portable' -PassThru
            Start-Sleep -Seconds 8
            Stop-Process -Id $bootstrap.Id -Force -ErrorAction SilentlyContinue
          }
          $dataRoot = Join-Path $env:APPDATA 'MetaQuotes\Terminal'
          $tradeInclude = Get-ChildItem @('C:\Program Files\MetaTrader 5', 'C:\Program Files (x86)\MetaTrader 5', $dataRoot) -Filter 'Trade.mqh' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $tradeInclude) { throw 'MT5 standard library Trade.mqh is missing; cannot compile EA safely.' }
          # Resolve the actual MT5 installation root from its standard library.
          $includeSource = $tradeInclude.Directory.Parent.FullName
          $mql5Root = $tradeInclude.Directory.Parent.Parent.FullName
          $mt5Root = Split-Path $mql5Root -Parent
          if (-not (Test-Path (Join-Path $mt5Root 'terminal64.exe'))) {
            throw "Could not resolve MT5 installation root from Trade.mqh: $($tradeInclude.FullName)"
          }
          if (-not (Test-Path (Join-Path $mql5Root 'Experts'))) {
            New-Item -ItemType Directory -Path (Join-Path $mql5Root 'Experts') -Force | Out-Null
          }

          # MetaEditor resolves <Trade/Trade.mqh> from the terminal data folder,
          # not necessarily from the installation folder. Seed that data folder
          # with the vendor's complete standard Include tree before compiling.
          $dataRoot = Join-Path $env:APPDATA 'MetaQuotes\Terminal'
          $dataCandidates = @(Get-ChildItem $dataRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'MQL5') })
          $sourceInclude = Join-Path $mql5Root 'Include'
          if (-not (Test-Path (Join-Path $sourceInclude 'Trade\Trade.mqh'))) {
            throw "Standard Include tree is missing from MT5 installation: $sourceInclude"
          }

          # A fresh hosted runner may not have created a terminal data profile yet.
          # MetaEditor identifies the default MT5 profile by this terminal hash;
          # create its MQL5 tree explicitly rather than failing before compilation.
          if ($dataCandidates.Count -eq 0) {
            $defaultDataFolder = Join-Path $dataRoot 'D0E8209F77C8CF37AD8BF550E51FF075'
            New-Item -ItemType Directory -Force -Path (Join-Path $defaultDataFolder 'MQL5') | Out-Null
            $dataCandidates = @(Get-Item $defaultDataFolder)
            Write-Host "Created fresh MetaEditor data profile: $defaultDataFolder"
          }
          foreach ($dataFolder in $dataCandidates) {
            $targetInclude = Join-Path $dataFolder.FullName 'MQL5\Include'
            New-Item -ItemType Directory -Force -Path $targetInclude | Out-Null
            Copy-Item (Join-Path $sourceInclude '*') $targetInclude -Recurse -Force
            Write-Host "Seeded MetaEditor include tree: $targetInclude"
          }
          "METAEDITOR=$editor" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MT5ROOT=$mt5Root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile both EAs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\ea | Out-Null
          $mt5Root = $env:MT5ROOT
          if (-not $mt5Root -or -not (Test-Path (Join-Path $mt5Root 'MQL5\Include\Trade\Trade.mqh'))) {
            throw "MT5 installation root or standard Trade.mqh not found: $mt5Root"
          }
          $experts = Join-Path $mt5Root 'MQL5\Experts'
          New-Item -ItemType Directory -Force -Path $experts | Out-Null
          $sources = @(
            @{ Source = 'mt5/Experts/Rayyan4GatewayEA.mq5'; Name = 'Rayyan4GatewayEA' }
          )
          foreach ($item in $sources) {
            $source = (Resolve-Path $item.Source).Path
            $terminalSource = Join-Path $experts ($item.Name + '.mq5')
            Copy-Item $source $terminalSource -Force
            $log = Join-Path $env:RUNNER_TEMP ($item.Name + '-compile.log')
            Remove-Item $log -Force -ErrorAction SilentlyContinue
            $args = "/compile:`"$terminalSource`" /log:`"$log`""
            $process = Start-Process -FilePath $env:METAEDITOR -ArgumentList $args -PassThru -Wait
            Start-Sleep -Seconds 2
            if (-not (Test-Path $log)) { throw "MetaEditor did not create compile log for $($item.Name); exit code $($process.ExitCode)." }
            Get-Content $log
            $compileLog = Get-Content $log -Raw
            if ($compileLog -match '(?im)\b[1-9]\d* errors?\b') { throw "MetaEditor reported compile errors for $($item.Name)." }
            $binary = Join-Path $experts ($item.Name + '.ex5')
            if (-not (Test-Path $binary)) { throw "EA compile did not produce $binary." }
            Copy-Item $binary (Join-Path 'build\ea' ($item.Name + '.ex5')) -Force
            Copy-Item $log (Join-Path 'build\ea' ($item.Name + '.log')) -Force
          }

      - name: Upload compiled EA binaries and logs
        uses: actions/upload-artifact@v4
        with:
          name: Rayyan-POWERFULL-MT5-EA-ex5
          path: build/ea/*
          if-no-files-found: error
          retention-days: 14
