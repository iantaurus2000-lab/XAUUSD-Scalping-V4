name: V5.2 CLEAN FINAL Emulator Gate
# FXOpen HMAC build gate

on:
  push:
    branches: [ main ]
    paths:
      - "v5.2-mobile-engine/**"
      - ".github/workflows/v5-2-final-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xauusd-v52-clean-final
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: FXOpen authentication matrix
        env:
          FXOPEN_WEB_API_ID: ${{ secrets.FXOPEN_WEB_API_ID }}
          FXOPEN_WEB_API_KEY: ${{ secrets.FXOPEN_WEB_API_KEY }}
          FXOPEN_WEB_API_SECRET: ${{ secrets.FXOPEN_WEB_API_SECRET }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, hmac, os, ssl, time, urllib.error, urllib.request

          ident=os.environ["FXOPEN_WEB_API_ID"].strip()
          key=os.environ["FXOPEN_WEB_API_KEY"].strip()
          secret=os.environ["FXOPEN_WEB_API_SECRET"].strip()

          def call(label, base, path, signed_base=None, auth_colon=False):
              ts=int(time.time()*1000)
              signed_base=signed_base or base
              uri=signed_base+path
              text=str(ts)+ident+key+"GET"+uri
              sig=base64.b64encode(hmac.new(secret.encode("ascii"),text.encode("ascii"),hashlib.sha256).digest()).decode("ascii")
              prefix="HMAC " if not auth_colon else "HMAC:"
              auth=prefix+ident+":"+key+":"+str(ts)+":"+sig
              req=urllib.request.Request(base+path,method="GET",headers={
                  "Accept":"application/json",
                  "Accept-Encoding":"gzip, deflate",
                  "Content-Type":"application/json",
                  "Authorization":auth})
              try:
                  with urllib.request.urlopen(req,timeout=12,context=ssl.create_default_context()) as r:
                      raw=r.read(); code=r.status; enc=(r.headers.get("Content-Encoding") or "").lower()
              except urllib.error.HTTPError as e:
                  raw=e.read(); code=e.code; enc=(e.headers.get("Content-Encoding") or "").lower()
              if enc=="gzip":
                  try: raw=gzip.decompress(raw)
                  except Exception: pass
              body=raw.decode("utf-8","replace").replace("\n"," ")
              print(label, "HTTP", code, "BODY", body[:180].strip())
              return code

          tests=[
            ("DEMO_V2_STANDARD", "https://marginalttdemowebapi.fxopen.net", "/api/v2/account", None, False),
            ("DEMO_V1_STANDARD", "https://marginalttdemowebapi.fxopen.net", "/api/v1/account", None, False),
            ("DEMO_V2_PORT443_SIGNED", "https://marginalttdemowebapi.fxopen.net", "/api/v2/account", "https://marginalttdemowebapi.fxopen.net:443", False),
            ("DEMO_V2_AUTH_COLON", "https://marginalttdemowebapi.fxopen.net", "/api/v2/account", None, True),
            ("LIVE_V2_STANDARD", "https://ttlivewebapi.fxopen.net", "/api/v2/account", None, False),
          ]
          codes={}
          for t in tests:
              try:
                  codes[t[0]]=call(*t)
              except Exception as e:
                  print(t[0], "CLIENT_ERROR", type(e).__name__, str(e)[:180])

          if any(v>=200 and v<300 for v in codes.values()):
              print("FXOPEN_AUTH_MATRIX_HAS_SUCCESS")
          else:
              print("FXOPEN_AUTH_MATRIX_NO_SUCCESS")
              raise SystemExit(1)
          PY

      - name: Gradle 8.10
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip
          echo "$PWD/gradle-8.10/bin" >> "$GITHUB_PATH"

      - name: Clean build
        working-directory: v5.2-mobile-engine
        run: gradle clean :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s "$GITHUB_WORKSPACE/v5.2-mobile-engine/app/build/outputs/apk/debug/app-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/v5.2-mobile-engine/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK handoff
        uses: actions/upload-artifact@v4
        with:
          name: v5-2-clean-apk
          path: v5.2-mobile-engine/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: v5-2-clean-apk
          path: test-apk

      - name: Verify APK handoff
        run: |
          ls -la "$GITHUB_WORKSPACE/test-apk"
          test -s "$GITHUB_WORKSPACE/test-apk/app-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/test-apk/app-debug.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator validation
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FXOPEN_WEB_API_ID: ${{ secrets.FXOPEN_WEB_API_ID }}
          FXOPEN_WEB_API_KEY: ${{ secrets.FXOPEN_WEB_API_KEY }}
          FXOPEN_WEB_API_SECRET: ${{ secrets.FXOPEN_WEB_API_SECRET }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -eux
            echo "ANDROID EMULATOR ONLINE"
            adb devices

            adb install -r "$GITHUB_WORKSPACE/test-apk/app-debug.apk"

            # Pre-grant notification permission so the first-run Android dialog
            # cannot cover the application's main screen during validation.
            adb shell pm grant com.xauusd.mobileengine android.permission.POST_NOTIFICATIONS || true

            adb shell am force-stop com.xauusd.mobileengine || true
            adb shell am start -W -n com.xauusd.mobileengine/.MainActivity

            sleep 10

            # REAL FXOpen Demo authentication test inside the Android emulator.
            # Credentials are supplied only from GitHub Actions Secrets and are
            # never printed to the workflow log.
            test -n "${FXOPEN_WEB_API_ID:-}"
            test -n "${FXOPEN_WEB_API_KEY:-}"
            test -n "${FXOPEN_WEB_API_SECRET:-}"
            set +x
            adb shell am broadcast -n com.xauusd.mobileengine/.FxOpenProbeReceiver --es fx_id "$FXOPEN_WEB_API_ID" --es fx_key "$FXOPEN_WEB_API_KEY" --es fx_secret "$FXOPEN_WEB_API_SECRET" --es fx_host "https://marginalttdemowebapi.fxopen.net" >/tmp/fxopen-probe-broadcast.txt 2>&1
            set -x

            sleep 8
            adb logcat -d -v time -s FXOPEN_PROBE:I FXOPEN_PROBE:E "*:S" > "$GITHUB_WORKSPACE/fxopen-probe.log"
            cat "$GITHUB_WORKSPACE/fxopen-probe.log"
            grep -q "PROBE_RESULT AUTHORIZED" "$GITHUB_WORKSPACE/fxopen-probe.log"
            echo "FXOPEN API AUTHENTICATION PASS"


            # Basic runtime health.
            test -n "$(adb shell pidof com.xauusd.mobileengine)"
            adb shell dumpsys package com.xauusd.mobileengine | grep -m1 "versionName"

            # UI must expose the XAUUSD engine screen. Do not require a
            # particular button label or dumpsys activity field because those
            # are implementation details that can vary across Android images.
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb shell cat /sdcard/window.xml > "$GITHUB_WORKSPACE/v5-2-ui.xml"
            grep -q "XAUUSD" "$GITHUB_WORKSPACE/v5-2-ui.xml"

            adb exec-out screencap -p > "$GITHUB_WORKSPACE/v5-2-clean.png"
            adb logcat -d -v time > "$GITHUB_WORKSPACE/v5-2-clean.log"

            ! grep -q "FATAL EXCEPTION" "$GITHUB_WORKSPACE/v5-2-clean.log"
            ! grep -q "Unable to start activity" "$GITHUB_WORKSPACE/v5-2-clean.log"
            ! grep -q "AndroidRuntime: FATAL" "$GITHUB_WORKSPACE/v5-2-clean.log"

            echo "V5.2 CLEAN EMULATOR GATE PASS"

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V5.2-clean-emulator-evidence
          path: |
            v5-2-clean.png
            v5-2-clean.log
            v5-2-ui.xml
            fxopen-probe.log

      - name: Publish final candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Mobile-Trading-Engine-V5.2-CLEAN-FINAL
          path: test-apk/app-debug.apk
          if-no-files-found: error
