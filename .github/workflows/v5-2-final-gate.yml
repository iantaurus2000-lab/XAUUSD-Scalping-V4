name: V5.2 FINAL Emulator Build Gate

on:
  push:
    branches: [ main ]
    paths:
      - "v5.2-mobile-engine/**"
      - ".github/workflows/v5-2-final-gate.yml"
  workflow_dispatch:

jobs:
  build-and-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.10
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip
          echo "$PWD/gradle-8.10/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: v5.2-mobile-engine
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK on runner
        run: |
          set -eux
          find "$GITHUB_WORKSPACE/v5.2-mobile-engine/app/build/outputs/apk" -type f -name "*.apk" -print
          test -s "$GITHUB_WORKSPACE/v5.2-mobile-engine/app/build/outputs/apk/debug/app-debug.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator validation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eux
            echo "PWD=$(pwd)"
            echo "WORKSPACE=$GITHUB_WORKSPACE"
            APK=$(find /home/runner/work -type f -name "app-debug.apk" -size +0c 2>/dev/null | head -1)
            test -n "$APK"
            test -s "$APK"
            adb install -r "$APK"
            adb shell am force-stop com.xauusd.mobileengine
            adb shell am start -n com.xauusd.mobileengine/.MainActivity
            sleep 25
            adb shell pidof com.xauusd.mobileengine
            adb shell dumpsys package com.xauusd.mobileengine | grep -m1 "versionName"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb shell cat /sdcard/window.xml | head -c 50000
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/v5-2-final.png"
            adb logcat -d -v time > "$GITHUB_WORKSPACE/v5-2-final.log"
            ! grep -q "FATAL EXCEPTION" "$GITHUB_WORKSPACE/v5-2-final.log"
            ! grep -q "Unable to start activity" "$GITHUB_WORKSPACE/v5-2-final.log"
            echo "V5.2 EMULATOR GATE PASS"

      - name: Publish APK and evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Mobile-Trading-Engine-V5.2-FINAL-CANDIDATE
          path: |
            v5.2-mobile-engine/app/build/outputs/apk/debug/app-debug.apk
            v5-2-final.png
            v5-2-final.log
