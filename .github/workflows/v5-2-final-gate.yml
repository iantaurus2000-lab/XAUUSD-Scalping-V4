name: V5.2 CLEAN FINAL Emulator Gate

on:
  push:
    branches: [ main ]
    paths:
      - "v5.2-mobile-engine/**"
      - ".github/workflows/v5-2-final-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xauusd-v52-clean-final
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.10
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip
          echo "$PWD/gradle-8.10/bin" >> "$GITHUB_PATH"

      - name: Clean build
        working-directory: v5.2-mobile-engine
        run: gradle clean :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s "$GITHUB_WORKSPACE/v5.2-mobile-engine/app/build/outputs/apk/debug/app-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/v5.2-mobile-engine/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK handoff
        uses: actions/upload-artifact@v4
        with:
          name: v5-2-clean-apk
          path: v5.2-mobile-engine/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: v5-2-clean-apk
          path: test-apk

      - name: Verify APK handoff
        run: |
          ls -la "$GITHUB_WORKSPACE/test-apk"
          test -s "$GITHUB_WORKSPACE/test-apk/app-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/test-apk/app-debug.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator validation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -eux
            echo "ANDROID EMULATOR ONLINE"
            adb devices
            adb install -r "$GITHUB_WORKSPACE/test-apk/app-debug.apk"
            adb shell am force-stop com.xauusd.mobileengine || true
            adb shell am start -W -n com.xauusd.mobileengine/.MainActivity
            sleep 25
            adb shell pidof com.xauusd.mobileengine
            adb shell dumpsys package com.xauusd.mobileengine | grep -m1 "versionName"
            adb shell dumpsys activity activities | grep -m1 "com.xauusd.mobileengine/.MainActivity"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb shell cat /sdcard/window.xml > "$GITHUB_WORKSPACE/v5-2-ui.xml"
            grep -q "XAUUSD" "$GITHUB_WORKSPACE/v5-2-ui.xml"
            grep -q "START AUTO" "$GITHUB_WORKSPACE/v5-2-ui.xml"
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/v5-2-clean.png"
            adb logcat -d -v time > "$GITHUB_WORKSPACE/v5-2-clean.log"
            ! grep -q "FATAL EXCEPTION" "$GITHUB_WORKSPACE/v5-2-clean.log"
            ! grep -q "Unable to start activity" "$GITHUB_WORKSPACE/v5-2-clean.log"
            ! grep -q "AndroidRuntime: FATAL" "$GITHUB_WORKSPACE/v5-2-clean.log"
            echo "V5.2 CLEAN EMULATOR GATE PASS"

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V5.2-clean-emulator-evidence
          path: |
            v5-2-clean.png
            v5-2-clean.log
            v5-2-ui.xml

      - name: Publish final candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Mobile-Trading-Engine-V5.2-CLEAN-FINAL
          path: test-apk/app-debug.apk
          if-no-files-found: error
