name: Rayyan11 EA MT5 Compile

on:
  workflow_dispatch:
  push:
    branches:
      - rayyan10-machine-quote-sync-audit
    paths:
      - "mt5/Experts/Rayyan4GatewayEA.mq5"
      - ".github/workflows/rayyan11-ea-build.yml"

jobs:
  compile-ea:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download MetaTrader 5 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile $installer
          if (!(Test-Path $installer) -or (Get-Item $installer).Length -lt 1000000) {
            throw "MetaTrader 5 installer download is missing or unexpectedly small."
          }
          Write-Host "Installer downloaded: $((Get-Item $installer).Length) bytes"

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          $mt5 = Join-Path $env:RUNNER_TEMP "RayyanMT5"
          Start-Process -FilePath $installer -ArgumentList @("/auto", "/path:$mt5") -Wait
          $metaeditor = Join-Path $mt5 "metaeditor64.exe"
          if (!(Test-Path $metaeditor)) {
            $metaeditor = Get-ChildItem -Path $env:ProgramFiles,$env:ProgramFiles(x86),$env:LOCALAPPDATA -Filter "metaeditor64.exe" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (!$metaeditor -or !(Test-Path $metaeditor)) {
            throw "MetaEditor 64-bit was not found after MT5 installation."
          }
          "METAEDITOR_PATH=$metaeditor" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MT5_PATH=$(Split-Path -Parent $metaeditor)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "MetaEditor: $metaeditor"

      - name: Compile the single Rayyan Gateway EA
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = (Resolve-Path "mt5/Experts/Rayyan4GatewayEA.mq5").Path
          $terminalExperts = Join-Path $env:MT5_PATH "MQL5\Experts"
          New-Item -ItemType Directory -Path $terminalExperts -Force | Out-Null
          Copy-Item $source (Join-Path $terminalExperts "Rayyan4GatewayEA.mq5") -Force
          $log = Join-Path $env:RUNNER_TEMP "Rayyan4GatewayEA-compile.log"
          $compiledSource = Join-Path $terminalExperts "Rayyan4GatewayEA.mq5"
          $process = Start-Process -FilePath $env:METAEDITOR_PATH -ArgumentList @("/compile:$compiledSource", "/log:$log") -Wait -PassThru
          Start-Sleep -Seconds 2
          if (!(Test-Path $log)) { throw "MetaEditor did not create a compile log (exit $($process.ExitCode))." }
          Get-Content $log
          $logText = Get-Content $log -Raw
          if ($logText -match "(?im)\b[1-9][0-9]* errors?\b" -or $logText -match "(?im)Result:\s*[1-9][0-9]* errors?") {
            throw "EA compile log reports errors."
          }
          $ex5 = Join-Path $terminalExperts "Rayyan4GatewayEA.ex5"
          if (!(Test-Path $ex5) -or (Get-Item $ex5).Length -lt 1000) {
            throw "Compiled .ex5 output is missing or unexpectedly small."
          }
          New-Item -ItemType Directory -Path "ea-artifacts" -Force | Out-Null
          Copy-Item $ex5 "ea-artifacts/Rayyan4GatewayEA.ex5" -Force
          Copy-Item $source "ea-artifacts/Rayyan4GatewayEA.mq5" -Force
          Copy-Item $log "ea-artifacts/Rayyan4GatewayEA-compile.log" -Force
          Get-FileHash "ea-artifacts/Rayyan4GatewayEA.ex5" -Algorithm SHA256 | Format-List | Out-String | Write-Host

      - name: Upload compiled EA and source
        uses: actions/upload-artifact@v4
        with:
          name: Rayyan11-MT5-EA
          path: ea-artifacts/
          if-no-files-found: error
          retention-days: 30
