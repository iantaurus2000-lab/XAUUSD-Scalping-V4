name: Rayyan4 Connection Test APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'pingtest/**'
      - '.github/workflows/build-connection-test.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build connection test APK
        run: gradle :pingtest:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Rayyan4-Connection-Test-APK
          path: pingtest/build/outputs/apk/debug/pingtest-debug.apk
