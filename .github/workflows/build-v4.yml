name: Build XAUUSD V4

on:
  workflow_dispatch:

jobs:
  build:
    name: Build XAUUSD Scalping V4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find V4 ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "XAUUSD_Scalping_Bot_V4.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: XAUUSD_Scalping_Bot_V4.zip tidak ditemukan"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract V4
        run: |
          mkdir -p project
          unzip -q "$ZIP" -d project

      - name: Find Android project
        run: |
          ROOT=$(find project -name "settings.gradle.kts" -type f | head -1 | xargs dirname)

          if [ -z "$ROOT" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan"
            find project -maxdepth 6 -type f
            exit 1
          fi

          echo "ROOT=$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.10-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.10/bin" >> "$GITHUB_PATH"

      - name: Copy Android project
        run: |
          cp -r "$ROOT/app" .
          cp "$ROOT/settings.gradle.kts" .
          cp "$ROOT/build.gradle.kts" .
          cp "$ROOT/gradle.properties" .

      - name: Build V4
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload V4 APK
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Scalping-V4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
