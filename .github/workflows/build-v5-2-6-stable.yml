name: LEGACY - FXOpen Build (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip
          echo "$PWD/gradle-8.10/bin" >> "$GITHUB_PATH"
      - working-directory: v5.2-mobile-engine
        run: gradle clean :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Mobile-Trading-Engine-FXOPEN-MANUAL
          path: v5.2-mobile-engine/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
