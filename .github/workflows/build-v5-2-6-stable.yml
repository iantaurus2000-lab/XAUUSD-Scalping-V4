name: XAUUSD Mobile Trading Engine V5.2.10 - FXOpen Market

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - "v5.2-mobile-engine/**"
      - ".github/workflows/build-v5-2-6-stable.yml"

concurrency:
  group: xauusd-mobile-engine
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: FXOpen WebSocket endpoint probe
        run: |
          set +e
          for path in "/" "/api/v1/feed" "/api/v1/feed/" "/api/v1" "/feed" "/ws" "/api/ws"; do
            echo "=== WSS $path ==="
            curl -sS -o /dev/null -D - --http1.1 --max-time 8 \
              -H "Connection: Upgrade" \
              -H "Upgrade: websocket" \
              -H "Sec-WebSocket-Version: 13" \
              -H "Sec-WebSocket-Key: SGVsbG9XU0tleQ==" \
              "https://marginalttdemowebapi.fxopen.net:443$path" | sed -n '1,8p'
          done
      - name: Install Gradle 8.10
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip
          echo "$PWD/gradle-8.10/bin" >> "$GITHUB_PATH"
      - name: Clean
        working-directory: v5.2-mobile-engine
        run: gradle clean --no-daemon
      - name: Build Debug APK
        working-directory: v5.2-mobile-engine
        run: |
          echo "FXOPEN V5.2.10 market build"
          echo "BUILD_TRIGGER_2026_10_04=3"
          gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          set -e
          APK=$(find v5.2-mobile-engine/app/build/outputs/apk -type f -name "*.apk" | head -1)
          test -n "$APK"
          echo "BUILD BERHASIL"
          sha256sum "$APK"
          ls -lh "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Mobile-Trading-Engine-V5.2.10-FXOPEN
          path: v5.2-mobile-engine/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
