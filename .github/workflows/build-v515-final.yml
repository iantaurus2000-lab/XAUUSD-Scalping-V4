name: XAUUSD BIQUOTE V5.1.5 FINAL BUILD

on:
  workflow_dispatch:
  push:
    paths:
      - "XAUUSD_BIQUOTE_V5_1_3_BACKGROUND_RESULT.zip"
      - ".github/workflows/build-v515-final.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.10
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip
          echo "$PWD/gradle-8.10/bin" >> "$GITHUB_PATH"

      - name: Extract source
        run: |
          set -e
          rm -rf source_project android_project
          mkdir source_project
          unzip -q XAUUSD_BIQUOTE_V5_1_3_BACKGROUND_RESULT.zip -d source_project
          SETTINGS=$(find source_project -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -1)
          test -n "$SETTINGS"
          ROOT=$(dirname "$SETTINGS")
          mkdir android_project
          cp -a "$ROOT"/. android_project/

      - name: Apply notification fix
        working-directory: android_project
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/xauusd/scalper/SignalService.kt")
          s = p.read_text()
          lines = s.splitlines()
          # Correct the two notification constants without touching AudioAttributes.USAGE_NOTIFICATION.
          for i, line in enumerate(lines):
              if "NotificationChannel(" in line and "XAUUSD BUY SELL Alerts" in line:
                  lines[i] = '        val ch = NotificationChannel("signal_alerts_v3", "XAUUSD BUY SELL Alerts", NotificationManager.IMPORTANCE_HIGH)'
              if "ch.setSound(" in line and "AudioAttributes.Builder()" in line:
                  lines[i] = '        if (soundOn) ch.setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION), AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_NOTIFICATION_HIGH).build()) else ch.setSound(null, null)'
          p.write_text("\n".join(lines) + "\n")
          PY
          echo "Checking SignalService.kt:"
          nl -ba app/src/main/java/com/xauusd/scalper/SignalService.kt | sed -n "74,81p"

      - name: Verify project
        working-directory: android_project
        run: |
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/xauusd/scalper/SignalService.kt

      - name: Debug SignalService source
        working-directory: android_project
        run: |
          nl -ba app/src/main/java/com/xauusd/scalper/SignalService.kt | sed -n "70,85p"

      - name: Build APK
        working-directory: android_project
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: android_project
        run: |
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -1)
          test -n "$APK"
          echo "BUILD BERHASIL"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Package final source
        run: |
          cd android_project
          zip -qr ../XAUUSD_BIQUOTE_V5_1_5_FINAL_SOURCE.zip . -x ".gradle/*" "build/*" "app/build/*"

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-BIQUOTE-V5-1-5-FINAL
          path: |
            android_project/app/build/outputs/apk/**/*.apk
            XAUUSD_BIQUOTE_V5_1_5_FINAL_SOURCE.zip
          if-no-files-found: error
