name: Build XAUUSD V4 SOURCE FINAL

on:
  workflow_dispatch:

jobs:
  build:
    name: Build XAUUSD Scalping V4 FINAL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Source ZIP
        run: |
          ZIP=$(find . -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Tidak ada ZIP source ditemukan"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "SOURCE ZIP: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Source
        run: |
          mkdir -p project
          unzip -q "$ZIP" -d project

      - name: Find Android Project
        run: |
          ROOT=$(find project -name "settings.gradle.kts" -type f | head -1 | xargs dirname)

          if [ -z "$ROOT" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan"
            find project -maxdepth 6 -type f
            exit 1
          fi

          echo "ANDROID ROOT: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.10
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.10-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.10/bin" >> "$GITHUB_PATH"

      - name: Copy Android Project
        run: |
          cp -r "$ROOT/app" .
          cp "$ROOT/settings.gradle.kts" .
          cp "$ROOT/build.gradle.kts" .
          cp "$ROOT/gradle.properties" .

      - name: Build APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Scalping-V4-FINAL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
