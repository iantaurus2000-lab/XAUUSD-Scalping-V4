name: Scalping V4 FINAL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Source ZIP
        run: |
          ZIP=$(find . -type f -name "XAUUSD_Scalping_V4_FINAL.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: XAUUSD_Scalping_V4_FINAL.zip tidak ditemukan"
            echo "File yang tersedia:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Source
        run: |
          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project

      - name: Find Android Project
        run: |
          SETTINGS=$(find project \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) tidak ditemukan"
            find project -maxdepth 4 -type f
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          echo "Android project ditemukan:"
          echo "$ROOT"

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.10
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip
          echo "$PWD/gradle-8.10/bin" >> "$GITHUB_PATH"

      - name: Prepare Android Project
        run: |
          rm -rf build_project
          mkdir build_project
          cp -r "$ROOT"/. build_project/

      - name: Build APK
        working-directory: build_project
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=$(find build_project/app/build/outputs/apk \
            -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan"
            exit 1
          fi

          echo "APK berhasil dibuat:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Scalping-V4-APK
          path: build_project/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
