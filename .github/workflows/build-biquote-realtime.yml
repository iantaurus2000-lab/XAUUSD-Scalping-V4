name: XAUUSD BIQUOTE REALTIME

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android Source
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "Android project sudah berada di root repository."
            exit 0
          fi

          ZIP=$(find . -maxdepth 3 -type f -name "XAUUSD_BIQUOTE_REALTIME_V5.zip" | head -1)
          if [ -z "$ZIP" ]; then
            ZIP=$(find . -maxdepth 3 -type f -name "*.zip" | head -1)
          fi
          if [ -z "$ZIP" ]; then
            echo "ERROR: Android source tidak ditemukan."
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "Source ZIP ditemukan: $ZIP"
          rm -rf source_project
          mkdir source_project
          unzip -q "$ZIP" -d source_project

          SETTINGS=$(find source_project -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) tidak ditemukan di ZIP."
            find source_project -maxdepth 5 -type f
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")
          cp -r "$ROOT"/. .

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.10
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip
          echo "$PWD/gradle-8.10/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan"
            exit 1
          fi
          echo "APK berhasil dibuat:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-BIQUOTE-REALTIME-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
