name: XAUUSD BIQUOTE V5.1.3 BACKGROUND RESULT

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.10
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip
          echo "$PWD/gradle-8.10/bin" >> "$GITHUB_PATH"

      - name: Prepare Android Project
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "Project ditemukan."
          elif [ -f settings.gradle ]; then
            echo "Project ditemukan."
          else
            ZIP=$(find . -type f \
              -name "XAUUSD_BIQUOTE_V5_1_3_BACKGROUND_RESULT.zip" \
              | head -1)

            if [ -z "$ZIP" ]; then
              echo "ERROR: Source ZIP tidak ditemukan."
              exit 1
            fi

            rm -rf source_project
            mkdir source_project
            unzip -q "$ZIP" -d source_project

            SETTINGS=$(find source_project -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              | head -1)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: Android project tidak ditemukan."
              exit 1
            fi

            ROOT=$(dirname "$SETTINGS")
            cp -r "$ROOT"/. .
          fi

      - name: Verify Project
        run: |
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts
          echo "Android project OK"

      - name: Build APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk \
            -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "BUILD BERHASIL"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-BIQUOTE-V5-1-3-BACKGROUND-RESULT-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
