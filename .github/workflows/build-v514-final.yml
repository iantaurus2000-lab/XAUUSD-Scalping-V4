name: XAUUSD BIQUOTE V5.1.4 FINAL BUILD

on:
  push:
    paths:
      - "XAUUSD_BIQUOTE_V5_1_3_BACKGROUND_RESULT.zip"
      - ".github/workflows/build-v514-final.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.10
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip
          echo "$PWD/gradle-8.10/bin" >> "$GITHUB_PATH"

      - name: Extract source project
        run: |
          set -e
          ZIP="XAUUSD_BIQUOTE_V5_1_3_BACKGROUND_RESULT.zip"
          test -f "$ZIP"
          rm -rf source_project
          mkdir source_project
          unzip -q "$ZIP" -d source_project

          SETTINGS=$(find source_project -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -1)

          test -n "$SETTINGS"
          ROOT=$(dirname "$SETTINGS")
          rm -rf android_project
          mkdir android_project
          cp -a "$ROOT"/. android_project/

      - name: Apply verified Kotlin fix
        working-directory: android_project
        run: |
          set -e
          if grep -RIl "USAGE_NOTIFICATION_HIGH" app/src/main/java; then
            grep -RIl "USAGE_NOTIFICATION_HIGH" app/src/main/java \
              | xargs sed -i 's/USAGE_NOTIFICATION_HIGH/IMPORTANCE_HIGH/g'
          fi
          if grep -RIn "USAGE_NOTIFICATION_HIGH" app/src/main/java; then
            echo "ERROR: invalid notification constant still exists"
            exit 1
          fi
          echo "Notification constant fixed to NotificationManager.IMPORTANCE_HIGH"

      - name: Verify Android project
        working-directory: android_project
        run: |
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts
          echo "Android project OK"

      - name: Build APK
        working-directory: android_project
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace --info

      - name: Verify APK
        working-directory: android_project
        run: |
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -1)
          test -n "$APK"
          echo "BUILD BERHASIL"
          ls -lh "$APK"

      - name: Package patched source ZIP
        run: |
          cd android_project
          zip -qr ../XAUUSD_BIQUOTE_V5_1_4_FINAL_SOURCE.zip . \
            -x ".gradle/*" "build/*" "app/build/*"

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-BIQUOTE-V5-1-4-FINAL
          path: |
            android_project/app/build/outputs/apk/**/*.apk
            XAUUSD_BIQUOTE_V5_1_4_FINAL_SOURCE.zip
          if-no-files-found: error
