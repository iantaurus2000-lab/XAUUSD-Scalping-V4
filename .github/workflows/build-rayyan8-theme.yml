name: Rayyan8 Theme Revision Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Restore stable Rayyan signing key
        run: base64 -d app/rayyan4-debug.keystore.b64 > app/rayyan4-debug.keystore
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Mobile-Engine-Rayyan8-Theme-Revision
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
