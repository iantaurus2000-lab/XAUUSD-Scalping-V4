name: Rayyan9 Validation and APK Build
on:
  push:
    branches:
      - rayyan9-spread-filter-manual-auto
      - rayyan9-market-exhaustion-market-order
      - rayyan9-open-action1-complete
  workflow_dispatch:
jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Restore stable Rayyan signing key
        run: base64 -d app/rayyan4-debug.keystore.b64 > app/rayyan4-debug.keystore
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Mobile-Trading-Engine-Rayyan9
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            mt5/Experts/Rayyan4GatewayEA.mq5
            mt5/Experts/Rayyan8IntegratedGatewayEA.mq5
          if-no-files-found: error
