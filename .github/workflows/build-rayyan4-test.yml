name: Rayyan4 Component Checks

on:
  workflow_dispatch:
  push:
    branches: [ main, rayyan-entry-ready-menu-fix, rayyan-stage1-professional-chart ]
    paths:
      - 'app/src/**'
      - 'app/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'mt5/**'
      - '.github/workflows/build-rayyan4-test.yml'

permissions:
  contents: read

concurrency:
  group: rayyan-component-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-unit-tests:
    name: Android unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

  mt5-source-contract:
    name: MT5 source and protocol guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify protected integration contract
        shell: bash
        run: |
          set -euo pipefail
          test -s mt5/Experts/Rayyan4GatewayEA.mq5
          test -s app/src/main/java/com/xauusd/mobileengine/GatewayService.java
          test -s app/src/main/java/com/xauusd/mobileengine/Mt5Gateway.java
          test -s app/src/main/res/xml/network_security_config.xml
          grep -q 'networkSecurityConfig="@xml/network_security_config"' app/src/main/AndroidManifest.xml
          grep -q '127.0.0.1' app/src/main/res/xml/network_security_config.xml
          grep -q '8787' app/src/main/java/com/xauusd/mobileengine/Mt5FeedClient.java
          grep -q 'publishMarketFeed' mt5/Experts/Rayyan4GatewayEA.mq5
          grep -q 'publishOrderState' mt5/Experts/Rayyan4GatewayEA.mq5
          echo "Protected files and key integration markers are present."
