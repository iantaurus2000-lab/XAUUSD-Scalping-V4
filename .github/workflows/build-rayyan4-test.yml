name: Rayyan4 Test Build • TEST QUEUE ACK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/src/**'
      - 'app/build.gradle'
      - 'app/build.gradle.kts'
      - 'app/rayyan4-debug.keystore.b64'
      - 'gradle.properties'
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Restore stable Rayyan4 signing key
        run: base64 -d app/rayyan4-debug.keystore.b64 > app/rayyan4-debug.keystore
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Mobile-Engine-RAYYAN4-TEST-QUEUE-ACK
          path: app/build/outputs/apk/debug/app-debug.apk
