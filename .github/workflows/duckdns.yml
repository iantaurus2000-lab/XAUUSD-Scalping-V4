name: DuckDNS Update

on:
  push:
    branches: [RAYYAN]
    paths:
      - ".github/workflows/duckdns.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: duckdns-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Validate DuckDNS configuration
        env:
          DUCKDNS_DOMAIN: ${{ vars.DUCKDNS_DOMAIN }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DUCKDNS_DOMAIN" ]; then
            echo "::error::Repository variable DUCKDNS_DOMAIN is missing."
            exit 1
          fi
          if [ -z "$DUCKDNS_TOKEN" ]; then
            echo "::error::Repository secret DUCKDNS_TOKEN is missing."
            exit 1
          fi
          if ! [[ "$DUCKDNS_DOMAIN" =~ ^[a-zA-Z0-9-]+$ ]]; then
            echo "::error::DUCKDNS_DOMAIN must contain only the DuckDNS subdomain name, without .duckdns.org."
            exit 1
          fi

      - name: Update DuckDNS IP
        env:
          DUCKDNS_DOMAIN: ${{ vars.DUCKDNS_DOMAIN }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --get \
            --data-urlencode "domains=$DUCKDNS_DOMAIN" \
            --data-urlencode "token=$DUCKDNS_TOKEN" \
            --data-urlencode "ip=" \
            https://www.duckdns.org/update)"
          if [ "$response" != "OK" ]; then
            echo "::error::DuckDNS update did not return OK."
            exit 1
          fi
          echo "DuckDNS update successful for configured hostname."
