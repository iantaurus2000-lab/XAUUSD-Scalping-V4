name: Rayyan4 Emulator Check
on:
  workflow_dispatch:
  push:
    branches: [ main, rayyan-entry-ready-menu-fix, rayyan-stage1-professional-chart ]

jobs:
  emulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Restore stable update signing key
        run: base64 -d app/rayyan4-debug.keystore.b64 > app/rayyan4-debug.keystore

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK immediately after successful build
        uses: actions/upload-artifact@v4
        with:
          name: Rayyan4-APK-Build
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: |
            bash .github/scripts/rayyan4-emulator-check.sh

      - name: Upload APK and emulator screenshots/logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rayyan4-Emulator-Report
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            emulator-artifacts/
          if-no-files-found: warn
          retention-days: 7
