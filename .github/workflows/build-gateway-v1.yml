name: Build XAUUSD Trading Gateway V1

on:
  workflow_dispatch:
  push:
    paths:
      - 'xauusd-trading-gateway/**'
      - '.github/workflows/build-gateway-v1.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: xauusd-trading-gateway
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK exists
        run: test -f xauusd-trading-gateway/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Trading-Gateway-V1
          path: xauusd-trading-gateway/app/build/outputs/apk/debug/app-debug.apk

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install emulator packages
        run: sdkmanager "platform-tools" "platforms;android-30" "system-images;android-30;google_apis;x86_64"
      - name: Create emulator
        run: echo "no" | avdmanager create avd -n gateway-test -k "system-images;android-30;google_apis;x86_64" --force
      - name: Start emulator
        run: |
          nohup emulator -avd gateway-test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect >/tmp/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 60); do
            if adb shell getprop sys.boot_completed | tr -d '\r' | grep -q 1; then break; fi
            sleep 2
          done
          adb shell getprop sys.boot_completed
      - name: Build APK for emulator
        working-directory: xauusd-trading-gateway
        run: gradle --no-daemon assembleDebug
      - name: Install APK
        run: adb install -r xauusd-trading-gateway/app/build/outputs/apk/debug/app-debug.apk
      - name: Launch and verify package
        run: |
          adb shell am force-stop com.xauusd.tradinggateway
          adb shell monkey -p com.xauusd.tradinggateway 1
          sleep 3
          adb shell pm path com.xauusd.tradinggateway
      - name: Start gateway service and verify notification
        run: |
          adb shell input tap 180 300 || true
          sleep 2
          adb shell dumpsys activity services com.xauusd.tradinggateway | grep -q GatewayService
