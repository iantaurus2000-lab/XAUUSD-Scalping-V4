name: Build XAUUSD Trading Gateway V3

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - 'xauusd-trading-gateway/**'
      - '.github/workflows/build-gateway-v1.yml'

# Gateway V3 emulator gate: build -> install -> launch -> foreground service -> notification
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build V3 APK
        working-directory: xauusd-trading-gateway
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK
        run: test -s xauusd-trading-gateway/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload V3 APK
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Trading-Gateway-V3
          path: xauusd-trading-gateway/app/build/outputs/apk/debug/app-debug.apk

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install emulator packages
        run: sdkmanager "platform-tools" "platforms;android-30" "build-tools;35.0.0" "emulator" "system-images;android-30;google_apis;x86_64"
      - name: Create AVD
        run: echo "no" | avdmanager create avd -n gateway-test -k "system-images;android-30;google_apis;x86_64" --force
      - name: Start emulator
        run: |
          nohup emulator -avd gateway-test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot >/tmp/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 90); do
            if adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q 1; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
      - name: Build APK for emulator
        working-directory: xauusd-trading-gateway
        run: gradle --no-daemon assembleDebug
      - name: Install APK
        run: adb install -r xauusd-trading-gateway/app/build/outputs/apk/debug/app-debug.apk
      - name: Launch activity
        run: adb shell monkey -p com.xauusd.tradinggateway 1
      - name: Start foreground gateway service
        run: |
          adb shell am start-foreground-service -n com.xauusd.tradinggateway/.GatewayService
          sleep 3
      - name: Verify package and GatewayService
        run: |
          adb shell pm path com.xauusd.tradinggateway
          adb shell dumpsys activity services com.xauusd.tradinggateway | grep -q GatewayService
          adb shell dumpsys notification | grep -q "XAUUSD Trading Gateway V3"
          echo "EMULATOR PASS: APK installed, activity launched, foreground GatewayService active, notification present"
