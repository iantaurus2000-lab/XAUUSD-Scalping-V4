name: Build XAUUSD Mobile Engine HP A

on:
  push:
    branches: [ main ]
    paths:
      - 'v5.2-mobile-engine/**'
      - '.github/workflows/build-hpa-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.10
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip
          echo "$PWD/gradle-8.10/bin" >> "$GITHUB_PATH"
      - name: Build HP A
        working-directory: v5.2-mobile-engine
        run: gradle clean :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          test -s v5.2-mobile-engine/app/build/outputs/apk/debug/app-debug.apk
          sha256sum v5.2-mobile-engine/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload HP A APK
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Mobile-Trading-Engine-HP-A-GATEWAY
          path: v5.2-mobile-engine/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
