plugins { id 'com.android.application' }

android {
    namespace 'com.xauusd.mobileengine'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xauusd.mobileengine'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.5.0-RAYYAN4-CHARTBASE'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        rayyanDebug {
            storeFile file('rayyan4-debug.keystore')
            storePassword System.getenv('RAYYAN4_KEY_PASSWORD') ?: 'rayyan4debug'
            keyAlias 'rayyan4debug'
            keyPassword System.getenv('RAYYAN4_KEY_PASSWORD') ?: 'rayyan4debug'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.rayyanDebug
        }
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
