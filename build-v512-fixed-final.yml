name: XAUUSD BIQUOTE V5.1.2 FIXED FINAL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract the correct source ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -name 'XAUUSD_BIQUOTE_V5_1_2_FIXED_FINAL_SOURCE.zip' | head -1)"
          test -n "$ZIP"
          rm -rf source_project
          mkdir source_project
          unzip -q "$ZIP" -d source_project
          cp -r source_project/. .
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          echo "Correct Android source installed."

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-BIQUOTE-V5-1-2-FIXED-FINAL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
